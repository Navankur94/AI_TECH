name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [rag-knowledge-assistant, agentic-support-triage, llm-gateway-evals]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [rag-knowledge-assistant, agentic-support-triage, llm-gateway-evals]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ${{ matrix.project }}:ci ${{ matrix.project }}
